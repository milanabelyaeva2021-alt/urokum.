<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Читай і перевіряй · Урокум</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Onest:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f6fc;--card:#fff;--ink:#29233d;--muted:#756d87;--line:#e4dcef;--green:#6845a6;--greenSoft:#efe8fb;--yellow:#f1c258;--warn:#8b4b19;--bad:#a53235;--badBg:#fceaea;--read:"Literata",Georgia,serif;--ui:"Onest",Arial,sans-serif}
:root[data-theme="dark"]{--bg:#191523;--card:#292339;--ink:#f7f2ff;--muted:#c4b8d7;--line:#48395c;--green:#c4a9fa;--greenSoft:#392c53;--yellow:#e8bc50;--warn:#f6cb7d;--bad:#ff9898;--badBg:#392323;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:130px}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--ui);padding:0 18px 100px}
button,a,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:var(--green)}:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.top{max-width:1100px;margin:auto;min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-size:23px;font-weight:800;letter-spacing:-1px;text-decoration:none;color:var(--ink)}.brand b{color:var(--green)}.top-actions{display:flex;gap:8px;align-items:center}.iconBtn{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:9px 13px;border-radius:12px;font-weight:650;font-size:13px;min-height:42px}
.progressStrip{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 12px}.progressInner{max-width:760px;margin:auto}.progressTop{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);font-weight:650;margin-bottom:9px}.progressBar{height:7px;background:var(--line);border-radius:6px;overflow:hidden}.progressBar i{display:block;height:100%;width:0;background:var(--green);border-radius:6px;transition:width .25s}
main{max-width:760px;margin:36px auto 0}
.eyebrow{margin:0 0 8px;font-size:12px;letter-spacing:.1em;font-weight:800;text-transform:uppercase;color:var(--green)}
h1{font-size:clamp(27px,4.5vw,43px);line-height:1.15;letter-spacing:-.035em;margin:0 0 14px;font-weight:800}
.subtitle{color:var(--muted);margin:0 0 22px;font-size:15px}
.reader{padding:0 0 30px}.pointLabel{display:flex;align-items:center;gap:12px;margin:18px 0 22px;color:var(--green);font-weight:800;font-size:14px}.pointNumber{display:grid;place-items:center;width:34px;height:34px;background:var(--yellow);border-radius:10px;color:#2a2608;font-weight:800}
.ebookText p{font:400 clamp(17px,1.7vw,20px)/1.85 var(--read);margin:0 0 1.25em;overflow-wrap:break-word;hyphens:auto}
.ebookText p:first-child:first-letter{font-weight:700}
.ebookText::selection,.ebookText p::selection{background:#b2e3cf}
.readEnd{margin:18px 0 8px;padding-top:16px;border-top:2px solid var(--line)}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.primary{background:var(--green);color:var(--bg);font-weight:800;border:0;border-radius:10px;padding:13px 18px;min-height:48px}
.secondary{background:var(--card);color:var(--ink);font-weight:650;border:1px solid var(--line);border-radius:10px;padding:12px 15px;min-height:45px}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin:13px 0}.actions>*{flex:1 1 180px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin:22px 0;box-shadow:0 14px 34px -30px #13251a}
.card h2{margin:0 0 10px;font-size:22px;line-height:1.3}.card p{margin:0 0 12px}
.stopCard:before{content:"";display:block;height:7px;border-radius:10px;background:repeating-linear-gradient(135deg,var(--yellow) 0 12px,#323025 12px 20px);margin:-22px -22px 18px}
.pill{display:inline-block;padding:4px 11px;border-radius:20px;background:var(--yellow);color:#332c0b;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.qNo{color:var(--muted);font-size:12px;font-weight:700}
.questionText{font-size:20px;font-weight:750;line-height:1.45;margin:14px 0 20px}
.answers{display:grid;gap:9px}.choice{width:100%;text-align:left;display:flex;gap:11px;align-items:flex-start;padding:13px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;line-height:1.5}.choice b{width:23px;flex:none;color:var(--green)}.choice.selected{outline:2px solid var(--green);outline-offset:0}.choice.correct{border-color:var(--green);background:var(--greenSoft)}.choice.wrong{border-color:var(--bad);background:var(--badBg)}.choice:disabled{opacity:1}
.quizFeedback{color:var(--muted);padding:13px 0 5px;font-size:14px;line-height:1.6}
.written{width:100%;min-height:136px;padding:14px 15px;border:1px solid var(--line);border-radius:11px;resize:vertical;background:var(--bg);color:var(--ink);line-height:1.6;margin-bottom:10px}
.reviewText{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--greenSoft);border-radius:10px;padding:14px;line-height:1.6;margin:14px 0}
.ask{border-top:1px solid var(--line);margin-top:30px;padding-top:15px}.ask summary{font-weight:750;cursor:pointer;color:var(--green)}.ask textarea{margin-top:13px}.ask p{color:var(--muted);font-size:13px}
.completion{border-color:var(--green);text-align:center}.completion .doneIcon{font-size:34px;color:var(--green)}.completion h2{font-size:24px}.small{font-size:13px;color:var(--muted)}
#tocPanel{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:#14231b87}
#tocPanel[hidden]{display:none}
.tocSheet{height:100%;width:min(100%,400px);overflow-y:auto;background:var(--card);padding:22px 19px;box-shadow:-10px 0 30px #0002}
.tocHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.tocHead h2{margin:0;font-size:22px}.tocChapter{font-size:13px;font-weight:800;color:var(--green);padding:13px 8px 8px}.tocItem{display:block;width:100%;border:0;border-radius:9px;background:transparent;color:var(--ink);padding:10px 11px;text-align:left;font-size:14px;line-height:1.5}.tocItem:hover,.tocItem.current{background:var(--greenSoft)}
#loading{margin:42px 0;color:var(--muted);line-height:1.7}
#loading[hidden],#bookShell[hidden],#quiz[hidden],#finished[hidden],#review[hidden]{display:none!important}
#quiz .buttons{margin-top:16px}
@media(max-width:650px){body{padding:0 15px 80px}.top{min-height:70px}main{margin-top:23px}.card{padding:18px}.stopCard:before{margin:-18px -18px 18px}.top-actions .iconBtn{padding:8px 10px}.ebookText p{line-height:1.75}.progressTop{font-size:11px}}

/* Structurally faithful electronic textbook blocks, in the original Urokum purple palette */
.ebookText{color:var(--ink)}
.ebookText h2.point-heading{font:800 clamp(21px,2.8vw,29px)/1.35 var(--ui);margin:23px 0 19px;color:var(--ink);letter-spacing:-.02em}
.ebookText p{line-height:1.87}
.ebook-table-wrap{margin:25px 0 30px;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
.ebook-table{border-collapse:collapse;width:100%;min-width:520px;background:var(--card);color:var(--ink);font:400 13.5px/1.55 var(--ui)}
.ebook-table caption{font-weight:800;text-align:left;font-size:16px;color:var(--ink);margin:0 0 9px;caption-side:top}
.ebook-table th,.ebook-table td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
.ebook-table th{background:#f2e6d6;color:#322735;font-weight:750}
.ebook-table tbody tr:nth-child(even){background:var(--bg)}
:root[data-theme="dark"] .ebook-table th{background:#483c56;color:#f8f0ff}
.ebook-bullets{font:400 17px/1.76 var(--read);padding-left:25px;margin:18px 0 27px}
.ebook-bullets li{margin-bottom:14px;padding-left:3px}
.ebook-vocab,.ebook-source{margin:25px 0 30px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:17px 20px}
.ebook-vocab summary,.ebook-source summary{font:800 16px/1.4 var(--ui);color:var(--green);cursor:pointer}
.ebook-vocab dl{margin:16px 0 0}.ebook-vocab dt{font-weight:800;color:var(--ink);margin-top:15px}.ebook-vocab dd{margin:5px 0 0;color:var(--muted);line-height:1.75;font-size:14px}
.ebook-source blockquote{margin:15px 0 0;padding:13px 15px;background:var(--bg);border-left:3px solid var(--green);border-radius:0 8px 8px 0;font:400 15px/1.75 var(--read)}
.ebook-source .source-caption{font-size:12px;color:var(--muted);margin:14px 0 0}
.ebook-chart{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:19px;margin:23px 0 28px}
.ebook-chart figcaption{font-weight:800;line-height:1.45;font-size:16px;margin-bottom:18px}
.ebook-chart-body{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:22px}
.ebook-pie{width:205px;aspect-ratio:1;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);flex:none}
.ebook-chart ul{padding:0;margin:0;list-style:none;min-width:180px;max-width:260px;font-size:14px}
.ebook-chart li{display:flex;gap:9px;align-items:baseline;margin-bottom:10px}
.ebook-chart .swatch{width:12px;height:12px;flex:none;border-radius:3px;margin-top:3px}
.ebook-chart .chart-note{font-size:12px;color:var(--muted);margin-top:15px}
.ebook-conclusion{border-left:4px solid var(--green);background:var(--greenSoft);padding:15px 18px;border-radius:0 12px 12px 0;margin:27px 0 30px}
.ebook-conclusion h3{font-size:17px;margin:0 0 9px}
.ebook-conclusion p{font-size:15px;line-height:1.75;margin:0}
@media(max-width:650px){.ebook-table{min-width:490px}.ebook-chart-body{flex-direction:column}.ebook-pie{width:185px}}
.ebook-fact{margin:22px 0 27px;border:1px solid var(--line);border-radius:13px;background:var(--greenSoft);padding:16px 19px}
.ebook-fact summary{font:800 15px/1.5 var(--ui);color:var(--green);cursor:pointer}
.ebook-fact p{font:400 15px/1.7 var(--ui);margin:13px 0 0;color:var(--ink)}

/* Urokum signature logo and electronic book cover */
.brand{display:inline-flex;align-items:center;gap:10px;font-size:25px;color:var(--ink)}
.brand-mark{display:grid;place-items:center;flex:none;width:35px;height:40px;clip-path:polygon(24% 0,76% 0,100% 25%,100% 75%,76% 100%,24% 100%,0 75%,0 25%);background:#ffc414;color:#211731;font:900 24px/1 var(--ui);text-shadow:0 1px #d49c00}
.book-preview{max-width:760px;margin:3px auto 18px;padding:14px 16px;display:flex;align-items:center;gap:18px;background:var(--card);border:1.5px solid #baa2e2;border-radius:18px;box-shadow:0 9px 26px -24px #37205f}
.book-cover{width:82px;min-width:82px;height:108px;display:grid;place-items:center;border-radius:11px 15px 15px 11px;background:linear-gradient(115deg,#8b68d9 0 12%,#aa8cf0 12% 100%);box-shadow:inset 6px 0 0 #6e4aa8,4px 6px 15px #48336920;color:#241638;text-align:center;font:800 19px/1.1 var(--ui)}
.book-preview-info{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.book-preview-info strong{font-size:19px;line-height:1.2}
.book-preview-info>span:not(.edition-label){font-size:14px;line-height:1.45;color:var(--muted)}
.edition-label{padding:5px 9px;border-radius:7px;background:var(--greenSoft);color:var(--green);font-size:11px;font-weight:850;letter-spacing:.025em}
:root{--reader-font-size:19px}
.ebookText p{font-size:var(--reader-font-size)!important;line-height:1.85}
.ebook-bullets{font-size:calc(var(--reader-font-size) - 1px)!important}
.ebook-vocab dd,.ebook-source blockquote,.ebook-fact p,.ebook-conclusion p{font-size:calc(var(--reader-font-size) - 4px)!important}
.ebook-table{font-size:calc(var(--reader-font-size) * .75)!important}
.ebook-table caption,.ebook-conclusion h3{font-size:calc(var(--reader-font-size) * .9)!important}
.ebook-vocab dt,.ebook-vocab summary,.ebook-fact summary,.ebook-source summary{font-size:calc(var(--reader-font-size) * .82)!important}
.ebookText h2.point-heading{font-size:calc(var(--reader-font-size) * 1.35)!important}
.reader-settings{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 23px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.settings-label{color:var(--muted);font-size:13px;font-weight:750;margin-right:auto}
.font-btn{min-width:43px;min-height:42px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:800;cursor:pointer}
.font-btn:hover{border-color:var(--green)}
.reader-settings .restart-paragraph{padding:9px 12px;min-height:42px;font-size:13px}
.quizSteps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;list-style:none;margin:0 0 22px;padding:0}
.quizStep{min-width:0}
.quizStep .bar{display:block;height:8px;border-radius:8px;background:var(--line)}
.quizStep .step-label{display:block;margin-top:6px;font-size:11px;color:var(--muted);font-weight:800}
.quizStep.current .bar{background:#eebf17}
.quizStep.correct .bar{background:#2f9861}
.quizStep.wrong .bar{background:#c83b3b}
.quizStep.skipped .bar{background:linear-gradient(90deg,#a9a1ba 50%,var(--line) 50%)}
.quizStep.pending .bar{background:var(--line)}
.choice.correct{background:#e0f5e7!important;border:2px solid #31995b!important;color:#175c38}
.choice.wrong{background:#fbe3e0!important;border:2px solid #b82e3d!important;color:#7a182b}
.choice.wrong span.answer-text{text-decoration:line-through}
.choice .choice-mark{margin-left:auto;font-weight:900;font-size:18px;flex:none}
.choice.correct .choice-mark{color:#257d46}
.choice.wrong .choice-mark{color:#ab2636}
:root[data-theme="dark"] .choice.correct{background:#183e2a!important;color:#d8ffe3}
:root[data-theme="dark"] .choice.wrong{background:#4d242b!important;color:#ffe2e2}
.quiz-feedback-box{padding:12px 14px;border-radius:11px;margin-top:12px;font-size:14px;line-height:1.65}
.quiz-feedback-box.is-correct{background:#e4f6e9;border:1px solid #79c893;color:#185630}
.quiz-feedback-box.is-wrong{background:#fee6e3;border:1px solid #df8888;color:#83232c}
.quiz-feedback-box.is-neutral{background:var(--greenSoft);border:1px solid var(--line);color:var(--ink)}
:root[data-theme="dark"] .quiz-feedback-box.is-correct{background:#173a28;color:#d2f5dc}
:root[data-theme="dark"] .quiz-feedback-box.is-wrong{background:#4b2630;color:#ffdfe1}
.completion{border-color:var(--line);text-align:left;position:relative;overflow:hidden;padding-top:25px}
.completion:before{content:"";position:absolute;top:0;left:0;right:0;height:9px;background:repeating-linear-gradient(135deg,#ffc414 0 14px,#292121 14px 27px)}
.completion .finish-badge{display:inline-block;margin:9px 0 13px;padding:7px 11px;border-radius:8px;background:#ffc414;color:#302410;font-size:12px;font-weight:900;letter-spacing:.05em}
.completion .score-big{font:850 clamp(46px,8vw,67px)/1.2 var(--ui);letter-spacing:-.05em;color:var(--ink);margin:10px 0 8px}
.completion .repeat-note{color:var(--ink);font-size:15px;line-height:1.6;margin:12px 0}
.completion .actions{display:flex;flex-wrap:wrap;gap:11px}
.completion .actions button{flex:1 1 210px}
.review-errors{margin:10px 0 17px;text-align:left;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.review-errors h3{margin:0 0 10px;font-size:16px}
.review-item{padding:10px 0;border-top:1px solid var(--line)}
.review-item:first-of-type{border-top:0}
.review-item strong{display:block;margin:0 0 5px}
.review-item p{margin:3px 0;font-size:13px;line-height:1.6}
.paragraph-summary{text-align:left;border-color:#c7b2eb}
.paragraph-summary h2{font-size:20px;margin:0 0 10px}
.paragraph-summary ol{margin:0;padding-left:22px;line-height:1.72}
.paragraph-summary li{padding:4px 0}
.summary-footnote{font-size:12px;color:var(--muted)}
@media(max-width:650px){.book-preview{padding:12px;gap:12px}.book-cover{width:70px;min-width:70px;height:93px;font-size:16px}.book-preview-info strong{font-size:17px}.book-preview-info>span:not(.edition-label){font-size:12px}.reader-settings .restart-paragraph{flex:1 1 100%}.completion .actions button{flex:1 1 100%}}


/* Reader has no distracting book-card header; controls live beside contents/theme/home. */
.top-font-controls{display:flex;gap:3px;align-items:center;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.top-font-controls .font-btn{min-width:34px;min-height:34px;padding:4px 6px;border:0;border-radius:7px;background:transparent;font-size:13px}
.top-font-controls .font-btn:hover,.top-font-controls .font-btn:focus-visible{background:var(--greenSoft)}
.reader-restart{display:flex;justify-content:flex-end;margin:0 0 10px}
.reader-restart .restart-paragraph{min-height:40px;padding:8px 13px;font-size:13px}
@media(max-width:730px){.top{gap:9px;flex-wrap:wrap}.top-actions{margin-left:auto;gap:5px;flex-wrap:wrap;justify-content:flex-end}.top-actions .iconBtn{min-height:37px;padding:7px 9px;font-size:12px}.top-font-controls .font-btn{min-width:30px;min-height:30px;font-size:12px}}
@media(max-width:450px){.brand{font-size:21px}.brand-mark{width:29px;height:34px;font-size:20px}.top{padding:8px 0}.top-actions{width:100%;justify-content:space-between}.top-font-controls{order:1}}

/* Reading-first layout: keep the actual textbook paragraph at the top. */
.reader{padding-top:2px}
.ebook-source-highlight{background:#f9dd8e;color:#251a34;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-radius:3px;padding:0 2px;outline:2px solid #e8b941}
:root[data-theme="dark"] .ebook-source-highlight{background:#a68232;color:#fff7db;outline-color:#deb54f}
.source-back-link{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:9px}
.source-note{font-size:13px;line-height:1.55;color:var(--muted);margin-top:8px}
mark.ebook-source-highlight{transition:background-color .2s}
</style>
</head>
<body>
<header class="top">
 <a href="/" class="brand" aria-label="Урокум — головна"><span class="brand-mark" aria-hidden="true">U</span><span>Урокум</span></a>
 <div class="top-actions">
  <button class="iconBtn" id="contentsBtn" type="button">☷ Зміст</button>
  <div class="top-font-controls" role="group" aria-label="Розмір шрифту">
    <button id="fontSmaller" class="font-btn" type="button" title="Зменшити шрифт" aria-label="Зменшити шрифт">A−</button>
    <button id="fontReset" class="font-btn" type="button" title="Звичайний розмір шрифту" aria-label="Звичайний шрифт">A</button>
    <button id="fontLarger" class="font-btn" type="button" title="Збільшити шрифт" aria-label="Збільшити шрифт">A+</button>
  </div>
  <button class="iconBtn" id="themeBtn" type="button" aria-label="Змінити тему">☾</button>
  <a href="/" class="iconBtn" style="text-decoration:none">Головна</a>
 </div>
</header>
<div class="progressStrip">
 <div class="progressInner">
  <div class="progressTop"><span id="progressName">Історія України · 11 клас</span><span id="progressStep"></span></div>
  <div class="progressBar" aria-label="Прогрес пунктів параграфа"><i id="progressFill"></i></div>
 </div>
</div>
<div id="tocPanel" hidden><nav class="tocSheet" aria-label="Зміст підручника">
 <div class="tocHead"><h2>Зміст підручника</h2><button class="iconBtn" id="closeToc">Закрити ✕</button></div>
 <div id="tocList"></div>
</nav></div>
<main>
 <div id="loading">Готую електронний текст підручника…</div>
 <div id="bookShell" hidden>
  <div class="eyebrow" id="lessonEyebrow">Історія України · 11 клас</div>
  <h1 id="lessonTitle">Електронний підручник</h1>
  <article class="reader">
   <div class="ebookText" id="ebookText"></div>
   <div class="readEnd" id="readEnd">
    <p class="hint">Коли дочитаєш пункт, перевір, що ти зрозумів(ла).</p>
    <button class="primary" id="beginQuiz">Я прочитав(ла), перевірити</button>
    <button class="secondary" id="skipAllQuiz" type="button">Пропустити перевірку →</button>
   </div>
  </article>
  <section id="quiz" class="card stopCard" hidden aria-live="polite"></section>
  <section id="finished" class="card completion" hidden></section>
  <section id="paragraphSummary" class="card paragraph-summary" hidden aria-live="polite"></section>
  <section id="review" class="card" hidden></section>
  <details class="ask" id="askPanel">
   <summary>💬 Запитати ШІ про прочитане</summary>
   <p>Запитай своїми словами про події, поняття чи причини.</p>
   <textarea id="studentQuestion" class="written" maxlength="500" rows="3" placeholder="Що саме хочеш зрозуміти?"></textarea>
   <button class="primary" id="sendQuestion">Запитати ШІ</button>
   <div id="answerFromAI" class="reviewText" hidden></div>
  </details>
